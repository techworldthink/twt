{% extends "shop/dashboard/base.html" %}

{% block dashboard_content %}
<div class="ultra-fade-in">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="display-6 fw-bold text-white mb-0">Categories</h2>
        <a href="{% url 'shop:admin_category_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i> Add Category
        </a>
    </div>

    <div class="glass rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="border-0 text-secondary small text-uppercase fw-bold">Name</th>
                        <th class="border-0 text-secondary small text-uppercase fw-bold">Slug</th>
                        <th class="border-0 text-secondary small text-uppercase fw-bold">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for category in categories %}
                    <tr>
                        <td><span class="fw-bold">{{ category.name }}</span></td>
                        <td>{{ category.slug }}</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a href="{% url 'shop:admin_category_edit' category.id %}" class="btn btn-sm btn-outline-light">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form action="{% url 'shop:admin_category_delete' category.id %}" method="post" onsubmit="return confirm('Are you sure you want to delete this category?');">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-4 text-secondary">No categories found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
