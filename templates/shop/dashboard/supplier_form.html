{% extends "shop/dashboard/base.html" %}

{% block dashboard_content %}
<div class="ultra-fade-in">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="display-6 fw-bold text-white mb-0">{{ action }} Supplier</h2>
        <a href="{% url 'shop:admin_suppliers' %}" class="btn btn-outline-light">
            <i class="bi bi-x-lg me-2"></i> Cancel
        </a>
    </div>

    <div class="glass rounded-4 p-5 shadow-lg">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="row g-4">
                {% for field in form %}
                <div class="{% if field.name == 'address' %}col-12{% else %}col-md-6{% endif %}">
                    <label class="form-label text-secondary small text-uppercase fw-bold">{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
            </div>
            <div class="mt-5 text-end">
                <button type="submit" class="btn btn-primary btn-lg px-5">Save Supplier</button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-control, input[type="text"], input[type="email"], textarea {
        display: block;
        width: 100%;
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 0.9rem 1.4rem;
        border-radius: 12px;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        background-color: rgba(255, 255, 255, 0.07);
        border-color: var(--bs-primary);
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        outline: none;
    }
</style>
{% endblock %}
